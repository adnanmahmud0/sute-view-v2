name: Production Zero-Downtime Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  detect:
    name: Detect Active Services
    runs-on: ubuntu-latest
    if: vars.DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    outputs:
      has_web: ${{ steps.detect.outputs.has_web }}
      has_admin: ${{ steps.detect.outputs.has_admin }}
      has_api: ${{ steps.detect.outputs.has_api }}
      image_tag: ${{ steps.detect.outputs.image_tag }}
      project_slug: ${{ steps.detect.outputs.project_slug }}
      domain: ${{ steps.detect.outputs.domain }}
      api_subdomain: ${{ steps.detect.outputs.api_subdomain }}
      admin_subdomain: ${{ steps.detect.outputs.admin_subdomain }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          HAS_WEB="$([ -d apps/web ] && echo true || echo false)"
          HAS_ADMIN="$([ -d apps/admin ] && echo true || echo false)"
          HAS_API="$([ -d apps/api ] && echo true || echo false)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          PROJECT_SLUG="${{ vars.PROJECT_SLUG || 'fullstack' }}"
          DOMAIN="${{ vars.DOMAIN || 'example.com' }}"
          API_SUBDOMAIN="${{ vars.API_SUBDOMAIN || 'api' }}"
          ADMIN_SUBDOMAIN="${{ vars.ADMIN_SUBDOMAIN || 'admin' }}"

          echo "has_web=$HAS_WEB" >> "$GITHUB_OUTPUT"
          echo "has_admin=$HAS_ADMIN" >> "$GITHUB_OUTPUT"
          echo "has_api=$HAS_API" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "project_slug=$PROJECT_SLUG" >> "$GITHUB_OUTPUT"
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "api_subdomain=$API_SUBDOMAIN" >> "$GITHUB_OUTPUT"
          echo "admin_subdomain=$ADMIN_SUBDOMAIN" >> "$GITHUB_OUTPUT"

      - id: matrix
        run: |
          SERVICES=()
          [ "${{ steps.detect.outputs.has_api }}" = "true" ] && SERVICES+=('"api"')
          [ "${{ steps.detect.outputs.has_admin }}" = "true" ] && SERVICES+=('"admin"')
          [ "${{ steps.detect.outputs.has_web }}" = "true" ] && SERVICES+=('"web"')
          JOINED=$(IFS=,; echo "${SERVICES[*]}")
          echo "matrix={\"service\":[$JOINED]}" >> "$GITHUB_OUTPUT"

  quality-check:
    name: Code Quality Gate
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Monorepo
        uses: ./.github/actions/setup-monorepo
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  bootstrap-server:
    name: Server Self-Bootstrap (Idempotent)
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync Deploy Scripts to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST || secrets.EC2_HOST }}
          username: ${{ secrets.SERVER_USER || secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.SERVER_SSH_KEY || secrets.EC2_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "deploy/*"
          target: "/opt/${{ needs.detect.outputs.project_slug }}"

      - name: Execute Server Provisioning
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST || secrets.EC2_HOST }}
          username: ${{ secrets.SERVER_USER || secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.SERVER_SSH_KEY || secrets.EC2_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: PROJECT_SLUG
          script: |
            export PROJECT_SLUG="${{ needs.detect.outputs.project_slug }}"
            chmod +x /opt/${PROJECT_SLUG}/deploy/*.sh
            /opt/${PROJECT_SLUG}/deploy/bootstrap.sh

  build-images:
    name: Build & Push Image (${{ matrix.service }})
    needs: [detect, quality-check]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Service Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:${{ needs.detect.outputs.image_tag }}
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://${{ needs.detect.outputs.domain }}
            NEXT_PUBLIC_ADMIN_URL=https://${{ needs.detect.outputs.admin_subdomain }}.${{ needs.detect.outputs.domain }}
            NEXT_PUBLIC_API_URL=https://${{ needs.detect.outputs.api_subdomain }}.${{ needs.detect.outputs.domain }}/api/v1
            APP_VERSION=${{ needs.detect.outputs.image_tag }}

  deploy:
    name: Blue/Green Zero-Downtime Deployment
    needs: [detect, bootstrap-server, build-images]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ needs.detect.outputs.domain }}
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST || secrets.EC2_HOST }}
          username: ${{ secrets.SERVER_USER || secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.SERVER_SSH_KEY || secrets.EC2_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            PROJECT_SLUG="${{ needs.detect.outputs.project_slug }}"
            TARGET_DIR="/opt/${PROJECT_SLUG}"

            echo "==> Authenticating server Docker with GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "==> Writing and cleaning environment configuration..."
            cat << 'ENV_EOF' > "${TARGET_DIR}/.env.raw"
            ${{ secrets.ENV_FILE }}
            ENV_EOF

            # Auto-inject derived environment variables if missing
            echo "PORT=5000" >> "${TARGET_DIR}/.env.raw"
            echo "IP_ADDRESS=0.0.0.0" >> "${TARGET_DIR}/.env.raw"
            echo "APP_VERSION=${{ needs.detect.outputs.image_tag }}" >> "${TARGET_DIR}/.env.raw"

            "${TARGET_DIR}/deploy/env-clean.sh" "${TARGET_DIR}/.env.raw" "${TARGET_DIR}/.env.cleaned"
            rm -f "${TARGET_DIR}/.env.raw"

            echo "==> Running Blue/Green deployment engine..."
            export PROJECT_SLUG="${PROJECT_SLUG}"
            export REGISTRY="ghcr.io/${{ github.repository }}"
            export IMAGE_TAG="${{ needs.detect.outputs.image_tag }}"
            export ENV_FILE="${TARGET_DIR}/.env.cleaned"
            export DOMAIN="${{ needs.detect.outputs.domain }}"
            export API_SUBDOMAIN="${{ needs.detect.outputs.api_subdomain }}"
            export ADMIN_SUBDOMAIN="${{ needs.detect.outputs.admin_subdomain }}"
            export HAS_API="${{ needs.detect.outputs.has_api }}"
            export HAS_ADMIN="${{ needs.detect.outputs.has_admin }}"
            export HAS_WEB="${{ needs.detect.outputs.has_web }}"

            "${TARGET_DIR}/deploy/deploy.sh"

  ssl:
    name: Automated SSL Provisioning
    needs: [detect, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Provision Let's Encrypt SSL
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST || secrets.EC2_HOST }}
          username: ${{ secrets.SERVER_USER || secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.SERVER_SSH_KEY || secrets.EC2_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            PROJECT_SLUG="${{ needs.detect.outputs.project_slug }}"
            export DOMAIN="${{ needs.detect.outputs.domain }}"
            export CERTBOT_EMAIL="${{ vars.CERTBOT_EMAIL || 'admin@' }}${{ needs.detect.outputs.domain }}"
            export API_SUBDOMAIN="${{ needs.detect.outputs.api_subdomain }}"
            export ADMIN_SUBDOMAIN="${{ needs.detect.outputs.admin_subdomain }}"
            export HAS_API="${{ needs.detect.outputs.has_api }}"
            export HAS_ADMIN="${{ needs.detect.outputs.has_admin }}"
            export HAS_WEB="${{ needs.detect.outputs.has_web }}"

            "/opt/${PROJECT_SLUG}/deploy/ssl.sh"

  smoke-test:
    name: Verification & Smoke Test
    needs: [detect, ssl]
    runs-on: ubuntu-latest
    steps:
      - name: Verify Live Endpoints
        run: |
          DOMAIN="${{ needs.detect.outputs.domain }}"
          API_URL="https://${{ needs.detect.outputs.api_subdomain }}.${DOMAIN}/health/live"
          echo "Testing API probe: $API_URL"
          if [ "$DOMAIN" != "example.com" ]; then
            curl -fsSL --retry 3 --retry-delay 5 "$API_URL" || echo "Warning: Health endpoint check returned non-200"
          fi

      - name: Publish Deployment Summary
        run: |
          cat << 'SUMMARY_EOF' >> "$GITHUB_STEP_SUMMARY"
          ### 🚀 Deployment Succeeded!

          | Service | URL |
          |---|---|
          | **Main Web** | [https://${{ needs.detect.outputs.domain }}](https://${{ needs.detect.outputs.domain }}) |
          | **Admin Portal** | [https://${{ needs.detect.outputs.admin_subdomain }}.${{ needs.detect.outputs.domain }}](https://${{ needs.detect.outputs.admin_subdomain }}.${{ needs.detect.outputs.domain }}) |
          | **API Endpoint** | [https://${{ needs.detect.outputs.api_subdomain }}.${{ needs.detect.outputs.domain }}/api/v1](https://${{ needs.detect.outputs.api_subdomain }}.${{ needs.detect.outputs.domain }}/api/v1) |
          | **Swagger UI** | [https://${{ needs.detect.outputs.api_subdomain }}.${{ needs.detect.outputs.domain }}/api/docs](https://${{ needs.detect.outputs.api_subdomain }}.${{ needs.detect.outputs.domain }}/api/docs) |

          - **Image Tag**: \`${{ needs.detect.outputs.image_tag }}\`
          - **Strategy**: Zero-downtime Blue/Green Swap with Nginx
          SUMMARY_EOF
