name: Expo Mobile CI/CD & Build

on:
  push:
    branches: [main]
    paths:
      - "apps/expo/**"
      - "packages/**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS build profile"
        required: true
        default: "preview"
        type: choice
        options:
          - preview
          - production
          - development
      platform:
        description: "Target platform"
        required: true
        default: "android"
        type: choice
        options:
          - android
          - all
          - ios

concurrency:
  group: expo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-expo:
    name: Detect Expo App
    runs-on: ubuntu-latest
    outputs:
      has_expo: ${{ steps.check.outputs.has_expo }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: echo "has_expo=$([ -d apps/expo ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build-expo:
    name: EAS Build & OTA Update
    needs: check-expo
    if: needs.check-expo.outputs.has_expo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Monorepo
        uses: ./.github/actions/setup-monorepo

      - name: Typecheck Expo Workspace
        run: npm run typecheck:expo

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Verify EAS Credentials
        id: eas-check
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning ::EXPO_TOKEN secret is not set. Run 'eas login' and add EXPO_TOKEN to GitHub repository secrets to enable automated EAS cloud builds."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger EAS Build (Cloud Runner)
        if: steps.eas-check.outputs.has_token == 'true'
        working-directory: apps/expo
        env:
          EXPO_PUBLIC_API_URL: https://${{ vars.API_SUBDOMAIN || 'api' }}.${{ vars.DOMAIN || 'example.com' }}/api/v1
        run: |
          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          PLATFORM="${{ github.event.inputs.platform || 'android' }}"
          eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive
