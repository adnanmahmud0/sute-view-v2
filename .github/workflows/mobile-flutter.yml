name: Flutter Mobile CI/CD & Build

on:
  push:
    branches: [main]
    paths:
      - "apps/flutter/**"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-flutter:
    name: Detect Flutter App
    runs-on: ubuntu-latest
    outputs:
      has_flutter: ${{ steps.check.outputs.has_flutter }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: echo "has_flutter=$([ -d apps/flutter ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build-flutter:
    name: Build Android APK & App Bundle
    needs: check-flutter
    if: needs.check-flutter.outputs.has_flutter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        working-directory: apps/flutter
        run: flutter pub get

      - name: Lint & Analyze Dart Code
        working-directory: apps/flutter
        run: flutter analyze

      - name: Run Dart Unit & Widget Tests
        working-directory: apps/flutter
        run: flutter test

      - name: Build Release APK
        working-directory: apps/flutter
        env:
          TARGET_API_URL: https://${{ vars.API_SUBDOMAIN || 'api' }}.${{ vars.DOMAIN || 'example.com' }}/api/v1
        run: |
          flutter build apk --release --dart-define=FLUTTER_API_URL="$TARGET_API_URL"

      - name: Build Release App Bundle (Google Play AAB)
        working-directory: apps/flutter
        env:
          TARGET_API_URL: https://${{ vars.API_SUBDOMAIN || 'api' }}.${{ vars.DOMAIN || 'example.com' }}/api/v1
        run: |
          flutter build appbundle --release --dart-define=FLUTTER_API_URL="$TARGET_API_URL"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-release-apk
          path: apps/flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-release-aab
          path: apps/flutter/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/flutter/build/app/outputs/flutter-apk/app-release.apk
            apps/flutter/build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
